spring:
  application:
    name: brasper-backend
  profiles:
    default: dev
  datasource:
    hikari:
      # Own schema: Supabase exposes `public` through its REST API, `brasper` is not exposed.
      schema: brasper
  flyway:
    default-schema: brasper
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks it matches.
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
