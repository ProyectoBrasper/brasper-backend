server:
  # Render injects PORT; falls back to 8080 on a local server.
  port: ${PORT:8080}
  shutdown: graceful
  # Behind Render's proxy the client address comes from X-Forwarded-For (only trusted from private proxy addresses);
  # the sign-in lockout counts failed attempts per username and address.
  forward-headers-strategy: native

brasper:
  security:
    jwt:
      # Missing or blank JWT_SECRET: the app refuses to start (allow-random-secret is only set in dev).
      secret: ${JWT_SECRET}

# The API docs list every endpoint to anyone, so they stay off unless SWAGGER_ENABLED=true is set.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    com.brasper: INFO
