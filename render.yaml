services:
  - type: web
    name: brasper-backend
    runtime: docker
    plan: free # sleeps after 15 min idle and has 512 MB; move to starter when real users arrive
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Secrets: set in the Render dashboard (never commit values).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Set to true only while you need Swagger; anyone can read the docs when it is on.
      - key: SWAGGER_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
