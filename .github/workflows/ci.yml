name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify

  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if PR changes more than 400 lines
        run: |
          # Generated files do not count (see AGENTS.md).
          changed=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" \
            -- . ':!mvnw' ':!mvnw.cmd' ':!.mvn' ':!*.lock' \
            | awk '{ if ($1 != "-") s += $1 + $2 } END { print s + 0 }')
          echo "Changed lines (excluding generated): $changed"
          if [ "$changed" -gt 400 ]; then
            echo "::error::PR has $changed changed lines; max is 400. Split it."
            exit 1
          fi
